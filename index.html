<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#1d1b2e;color:#fff;text-align:center}canvas{width:min(90vw,512px);height:min(90vw,512px);image-rendering:pixelated;border:2px solid #8a4fff;touch-action:none;background:#fff}button,input{margin:4px;padding:8px;border-radius:8px}
</style></head><body>
<h2>Texture Maker</h2>
<canvas id="c" width="16" height="16"></canvas><br>
<input type="color" id="col"><button id="eraser">Borrador</button><button id="clear">Limpiar</button>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;let erase=false,painting=false;
function getPixel(e){
 const r=c.getBoundingClientRect();
 const cx=e.touches?e.touches[0].clientX:e.clientX;
 const cy=e.touches?e.touches[0].clientY:e.clientY;
 const x=Math.floor((cx-r.left)*(c.width/r.width));
 const y=Math.floor((cy-r.top)*(c.height/r.height));
 return {x:Math.max(0,Math.min(15,x)),y:Math.max(0,Math.min(15,y))};
}
function paint(e){
 const p=getPixel(e);
 ctx.clearRect(p.x,p.y,1,1);
 if(!erase){ctx.fillStyle=col.value;ctx.fillRect(p.x,p.y,1,1);}
}
function start(e){painting=true;paint(e);e.preventDefault();}
function move(e){if(!painting)return;paint(e);e.preventDefault();}
function end(){painting=false;}
c.addEventListener('mousedown',start);
c.addEventListener('mousemove',move);
window.addEventListener('mouseup',end);
c.addEventListener('touchstart',start,{passive:false});
c.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',end);
eraser.onclick=()=>erase=!erase;
clear.onclick=()=>ctx.clearRect(0,0,16,16);
</script></body></html>
