<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloy-Style</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background:
                radial-gradient(circle at top left,#7b2ff7 0%,transparent 30%),
                radial-gradient(circle at bottom right,#00c6ff 0%,transparent 30%),
                linear-gradient(135deg,#050505,#111,#0b0b0b);
        }

        .glow{
            position:absolute;
            width:500px;
            height:500px;
            border-radius:50%;
            filter:blur(120px);
            opacity:.25;
            animation:float 8s ease-in-out infinite;
        }

        .g1{
            background:#7b2ff7;
            top:-150px;
            left:-100px;
        }

        .g2{
            background:#00c6ff;
            bottom:-150px;
            right:-100px;
            animation-delay:4s;
        }

        @keyframes float{
            0%{transform:translateY(0px);}
            50%{transform:translateY(30px);}
            100%{transform:translateY(0px);}
        }

        .panel{
            width:420px;
            padding:40px;
            border-radius:30px;
            background:rgba(15,15,15,.85);
            border:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            box-shadow:
                0 0 40px rgba(123,47,247,.25),
                0 0 80px rgba(0,198,255,.12);
            text-align:center;
            position:relative;
            z-index:10;
        }

        h1{
            color:white;
            font-size:42px;
            margin-bottom:12px;
            letter-spacing:2px;
            background:linear-gradient(90deg,#9d4dff,#00c6ff,#ff4fd8);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .subtitle{
            color:#a0a0a0;
            margin-bottom:35px;
            font-size:15px;
        }

        .buttons{
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        .btn{
            position:relative;
            text-decoration:none;
            color:white;
            padding:16px;
            border-radius:18px;
            font-size:18px;
            font-weight:700;
            transition:.25s;
            overflow:hidden;
            border:none;
        }

        .btn::before{
            content:"";
            position:absolute;
            inset:0;
            background:linear-gradient(90deg,#7b2ff7,#00c6ff,#ff4fd8);
            opacity:1;
            z-index:-2;
        }

        .btn::after{
            content:"";
            position:absolute;
            inset:2px;
            border-radius:16px;
            background:#111;
            z-index:-1;
        }

        .btn:hover{
            transform:translateY(-4px) scale(1.02);
            box-shadow:
                0 0 20px rgba(123,47,247,.6),
                0 0 30px rgba(0,198,255,.4);
        }

        .footer{
            margin-top:28px;
            color:#666;
            font-size:13px;
        }
    </style>
</head>
<body>

    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="panel">
        <h1>Cloy-Style</h1>
        <div class="subtitle">
            Interfaz moderna • Elegante • Neon Dark
        </div>

        <div class="buttons">
            <a class="btn" href="https://www.mediafire.com/file/sg60ekg9clxc26p/99+Noches+en+el+Bosque+PAGA+(Lobby).rbxl/file">
                Lobby
            </a>

            <a class="btn" href="https://www.mediafire.com/file/kyszd61q7snvow5/99+Noches+en+el+Bosque+PAGA+(Principal).rbxl/file">
                Juego Principal
            </a>
        </div>

        <div class="footer">
            Cloy UI Experience
        </div>
    </div>

</body>
</html>
